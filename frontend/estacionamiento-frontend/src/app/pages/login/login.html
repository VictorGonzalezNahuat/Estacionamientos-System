<div class="login-wrapper">

  <div class="background-overlay"></div>

  <div class="login-card">
    <h1 class="brand-title">Estacionamiento</h1>
    <p class="subtitle">Sistema de Gestión de Estacionamiento</p>

    <div class="form-group">
      <input
        type="text"
        placeholder="Usuario"
        [(ngModel)]="username"
      />
    </div>

    <div class="form-group">
      <input
        type="password"
        placeholder="Contraseña"
        [(ngModel)]="password"
      />
    </div>

    <button class="login-btn" (click)="onLogin()">
      Ingresar
    </button>

    @if (errorMessage) {
      <p class="error">{{ errorMessage }}</p>
    }
  </div>

</div>
